[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afd-story-data-analysis"
version = "0.1.0"
description = "Clean and analyze AFD story study data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "supabase>=2.10",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
